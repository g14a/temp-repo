name: Release Master Sync

# A release branch may merge to `master` only if it already contains the latest
# `master` commit in its ancestry. Applies to release/* and release-* sources
# targeting master.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: release-master-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-master-sync:
    name: release-master-sync
    runs-on: ubuntu-latest
    steps:
      - name: Detect release branch
        id: guard
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Source branch: $HEAD_BRANCH"
          if [[ "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == release-* ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release branch — sync check skipped (release-branch-policy blocks it)."
          fi

      - name: Checkout full history
        if: steps.guard.outputs.is_release == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify release contains latest master
        if: steps.guard.outputs.is_release == 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # master can move while the PR is open — fetch its CURRENT tip.
          git fetch --no-tags origin "$BASE_REF"
          MASTER_SHA="$(git rev-parse FETCH_HEAD)"

          echo "Latest master ($BASE_REF): $MASTER_SHA"
          echo "PR head SHA:              $HEAD_SHA"

          # Ancestry: is latest master an ancestor of the PR head?
          if git merge-base --is-ancestor "$MASTER_SHA" "$HEAD_SHA"; then
            echo "✅ PASS — release branch contains the latest master commit."
            exit 0
          fi

          cat <<'EOF'
          ❌ Release branch is not up to date with master.

          The release branch does not contain the latest master commit.

          Please merge or rebase the latest master into this release branch
          before merging this PR.
          EOF
          exit 1
