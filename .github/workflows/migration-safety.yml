name: Migration Safety

# Detects DB migrations that could cause a production CPU/memory/I/O/lock spike.
# Only inspects `.db/*.sql` files ADDED or MODIFIED by the PR. Analyzer is pure
# awk (preinstalled on ubuntu-latest). No Python, no pip, no runtime install.
# HIGH risk => fails this check, requests the author's team for review, and
# posts an explanatory PR comment. No production database access.
#
# `paths` limits the trigger to PRs that actually touch `.db/`, so no migration
# PR = this workflow never runs. Because a skipped job cannot report a required
# status, this check is NOT in the master ruleset's required-checks list; it is
# advisory (blocks nothing on its own) unless re-added to required.
on:
  pull_request:
    branches:
      - master
    paths:
      - '.db/**'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write   # post comment + request reviewers

concurrency:
  group: migration-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: migration-safety
    runs-on: ubuntu-latest
    steps:
      - name: Guard — release branches only
        id: guard
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == release-* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a release branch — migration-safety skipped."
          fi

      - name: Checkout PR
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Find changed migrations
        if: steps.guard.outputs.run == 'true'
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" || true
          git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" -- '.db/' \
            | grep -Ei '\.sql$' > changed_migrations.txt || true
          echo "Changed migrations:"; cat changed_migrations.txt || true
          if [[ -s changed_migrations.txt ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze migrations
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any == 'true'
        id: analyze
        env:
          RISK_FILE: risk.txt
        run: |
          set -euo pipefail
          mapfile -t FILES < changed_migrations.txt
          awk -f .github/scripts/migration_safety.awk "${FILES[@]}" | tee migration-report.md
          RISK="$(cat risk.txt 2>/dev/null || echo LOW)"
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"
          cat migration-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: No migrations changed
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any != 'true'
        run: echo "✅ No .db/*.sql migrations changed by this PR." >> "$GITHUB_STEP_SUMMARY"

      # ---- HIGH-risk escalation: request review from the author's own team(s) ----
      # The PR author belongs to one or more GitHub teams in the org. We find
      # those teams and request review from them (which notifies the other
      # members; the author cannot review their own PR). Individual teammates are
      # named in the comment for visibility.
      #
      # NOTE: reading org teams/membership needs a token with `read:org` and
      # `members` access. The default GITHUB_TOKEN usually cannot list org teams;
      # provide a PAT/app token as `GH_TOKEN` (secret) for this to work. Requires
      # an organization repo — personal repos have no teams.
      - name: Request review from author's team on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        continue-on-error: true   # a review-request failure must not skip the fail step
        env:
          GH_TOKEN: ${{ secrets.ORG_REVIEW_TOKEN || github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -uo pipefail
          ORG="${GITHUB_REPOSITORY%%/*}"
          : > teams.txt; : > reviewers.txt

          # Teams in the org that the PR author is a member of.
          for slug in $(gh api --paginate "orgs/${ORG}/teams" -q '.[].slug' 2>/dev/null); do
            if gh api "orgs/${ORG}/teams/${slug}/memberships/${AUTHOR}" >/dev/null 2>&1; then
              echo "$slug" >> teams.txt
            fi
          done

          if [[ ! -s teams.txt ]]; then
            echo "::warning::No org team found for author '${AUTHOR}' (needs an org repo + read:org token). Check still fails."
            exit 0
          fi

          echo "Author '${AUTHOR}' teams:"; cat teams.txt
          # Other members of those teams (union, minus the author) for the comment.
          while IFS= read -r t; do
            gh api --paginate "orgs/${ORG}/teams/${t}/members" -q '.[].login' 2>/dev/null
          done < teams.txt | grep -viE "^${AUTHOR}\$" | sort -u > reviewers.txt || true

          # Request the author's team(s) as reviewers.
          ARGS=(); while IFS= read -r t; do ARGS+=(-f "team_reviewers[]=$t"); done < teams.txt
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/requested_reviewers" \
            "${ARGS[@]}" \
            || echo "::warning::Could not auto-request team review (token scope/access). Check still fails."

      - name: Comment on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          {
            echo "🚨 **Automatic escalation: HIGH-risk database migration**"
            echo ""
            if [[ -s teams.txt ]]; then
              printf 'Requesting review from @%s'"'"'s team(s):' "$AUTHOR"
              while IFS= read -r t; do printf ' `@%s/%s`' "${GITHUB_REPOSITORY%%/*}" "$t"; done < teams.txt
              echo ""
              if [[ -s reviewers.txt ]]; then
                printf 'Teammates:'
                while IFS= read -r u; do printf ' @%s' "$u"; done < reviewers.txt
                echo ""
              fi
            else
              echo "Could not resolve @${AUTHOR}'s team (needs an org repo + read:org token)."
            fi
            echo ""
            echo "This PR is blocked by the required \`migration-safety\` check until the risk"
            echo "is resolved or a teammate approves a mitigation plan."
            echo ""
            cat migration-report.md
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: Fail on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        run: |
          echo "❌ HIGH-risk migration detected — blocking merge."
          exit 1

      - name: Warn on MEDIUM risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'MEDIUM'
        run: echo "⚠️ MEDIUM-risk migration — review recommended (not blocking)."
