name: Migration Safety

# Detects DB migrations that could cause a production CPU/memory/I/O/lock spike.
# Only inspects `.db/*.sql` files ADDED or MODIFIED by the PR. Analyzer is pure
# awk (preinstalled on ubuntu-latest) — no Python, no pip, no runtime install.
# HIGH risk => fails the required `migration-safety` check, requests a DevOps
# review, and posts an explanatory PR comment. No production database access.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write   # post comment + request reviewers

concurrency:
  group: migration-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration-safety:
    name: migration-safety
    runs-on: ubuntu-latest
    steps:
      - name: Guard — release branches only
        id: guard
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_BRANCH" == release/* || "$HEAD_BRANCH" == release-* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a release branch — migration-safety skipped."
          fi

      - name: Checkout PR
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Find changed migrations
        if: steps.guard.outputs.run == 'true'
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" || true
          git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" -- '.db/' \
            | grep -Ei '\.sql$' > changed_migrations.txt || true
          echo "Changed migrations:"; cat changed_migrations.txt || true
          if [[ -s changed_migrations.txt ]]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Analyze migrations
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any == 'true'
        id: analyze
        env:
          RISK_FILE: risk.txt
        run: |
          set -euo pipefail
          mapfile -t FILES < changed_migrations.txt
          awk -f .github/scripts/migration_safety.awk "${FILES[@]}" | tee migration-report.md
          RISK="$(cat risk.txt 2>/dev/null || echo LOW)"
          echo "risk=$RISK" >> "$GITHUB_OUTPUT"
          cat migration-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: No migrations changed
        if: steps.guard.outputs.run == 'true' && steps.changed.outputs.any != 'true'
        run: echo "✅ No .db/*.sql migrations changed by this PR." >> "$GITHUB_STEP_SUMMARY"

      # ---- HIGH-risk escalation: request review from all other collaborators ----
      - name: Request reviews from other team members on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        continue-on-error: true   # a review-request failure must not skip the fail step
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          # Everyone with access to the repo, minus the PR author and bots.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/collaborators" \
            -q '.[].login' \
            | grep -viE "^${AUTHOR}\$" \
            | grep -viE '\[bot\]$' \
            | sort -u > reviewers.txt || true

          if [[ ! -s reviewers.txt ]]; then
            echo "No other collaborators to request (author is the only member)." | tee reviewers_note.txt
            exit 0
          fi

          echo "Requesting review from:"; cat reviewers.txt
          # Build reviewers[]=<login> args for the API call.
          ARGS=(); while IFS= read -r u; do ARGS+=(-f "reviewers[]=$u"); done < reviewers.txt
          gh api --method POST -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR}/requested_reviewers" \
            "${ARGS[@]}" \
            || echo "::warning::Could not auto-request one or more reviewers (permissions/access). Check still fails."

      - name: Comment on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "🚨 **Automatic escalation: HIGH-risk database migration**"
            echo ""
            if [[ -s reviewers.txt ]]; then
              printf 'Requesting review from all other team members:'
              while IFS= read -r u; do printf ' @%s' "$u"; done < reviewers.txt
              echo ""
            else
              echo "No other team members available to request a review."
            fi
            echo ""
            echo "This PR is blocked by the required \`migration-safety\` check until the risk"
            echo "is resolved or a reviewer approves a mitigation plan."
            echo ""
            cat migration-report.md
          } > comment.md
          gh pr comment "$PR" --body-file comment.md

      - name: Fail on HIGH risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'HIGH'
        run: |
          echo "❌ HIGH-risk migration detected — blocking merge."
          exit 1

      - name: Warn on MEDIUM risk
        if: steps.guard.outputs.run == 'true' && steps.analyze.outputs.risk == 'MEDIUM'
        run: echo "⚠️ MEDIUM-risk migration — review recommended (not blocking)."
